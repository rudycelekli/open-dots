        pathlib.Path(os.environ[''RUNNER_TEMP''], ''source-''+''baseline''+''-''+os.environ[''POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
    - name: Preserve actual SQLite semantic receipts baseline
      shell: python
      run: 'import pathlib,os

        p=pathlib.Path(os.environ[''RUNNER_TEMP'']);[(f.rename(p/(''baseline-''+f.name))) for f in p.glob(''routine-gap-*.json'')]'
    - name: Apply exact candidate packet
