name: OpenDots matched Ubuntu26 engine resilience diagnostic
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - lane: baseline
          source: c417f0987f709e703dd9e32727422f1bc99688a1
        - lane: candidate
          source: 113fb7b86c1e01fe18681b5e6b6d069e43adeb49
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    env:
      EXPECTED_SOURCE: ${{ matrix.source }}
      DATABASE_BACKEND: sqlite
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        repository: Anil-matcha/open-dots
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: astral-sh/setup-uv@v5.4.2
    - name: Install frozen native Python dependencies
      run: uv sync --frozen
    - name: Exact failed native test and owned process control
      shell: bash
      run: "uv run python <<'PY'\nimport subprocess, pathlib, os, json, time, signal,\
        \ hashlib, platform\nout=pathlib.Path(os.environ['RUNNER_TEMP'])/'probe26';out.mkdir(exist_ok=True)\n\
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_SOURCE']\n\
        assert platform.python_version().startswith('3.14.')\nrelease=pathlib.Path('/etc/os-release').read_text();assert\
        \ 'VERSION_ID=\"26.04\"' in release,release\nmeta={'os_release':release,'image_os':os.environ.get('ImageOS'),'image_version':os.environ.get('ImageVersion'),'python':platform.python_version(),'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'uvlock':hashlib.sha256(pathlib.Path('uv.lock').read_bytes()).hexdigest(),'ps_version':subprocess.run(['ps','--version'],capture_output=True,text=True).stdout}\n\
        (out/'runtime.json').write_text(json.dumps(meta,indent=2))\n# Independent\
        \ control: the unchanged test's exact ps invocation must observe an owned\
        \ shell process with a long fixture path.\ncontrol=out/'test_a_hanging_and_a_crashing_0'/'hang-codex-od-control';control.parent.mkdir();control.write_text('#!/bin/sh\\\
        nsleep 600\\n');control.chmod(0o700)\np=subprocess.Popen([str(control),'--version'],start_new_session=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)\n\
        try:\n deadline=time.monotonic()+2;seen=[]\n while time.monotonic()<deadline:\n\
        \  rows=subprocess.run(['ps','-axo','pid=,command='],capture_output=True,text=True).stdout\n\
        \  seen=[x for x in rows.splitlines()if str(control) in x]\n  if seen:break\n\
        \  time.sleep(.1)\n (out/'process-control.json').write_text(json.dumps({'pid':p.pid,'observed_rows':seen,'ok':bool(seen)},indent=2));assert\
        \ seen,'independent ps control did not observe owned shell'\nfinally:\n os.killpg(p.pid,signal.SIGKILL);p.wait(timeout=5)\n\
        base=out/'pytest';log=(out/'pytest.log').open('w')\ncmd=['uv','run','pytest','-q','tests/e2e/test_engine_resilience.py','--basetemp='+str(base),'--junitxml='+str(out/'junit.xml')]\n\
        p=subprocess.Popen(cmd,stdout=log,stderr=subprocess.STDOUT)\nwith (out/'process-observations.jsonl').open('w')as\
        \ f:\n while p.poll()is None:\n  rows=subprocess.run(['ps','-axo','pid=,command='],capture_output=True,text=True).stdout\n\
        \  selected=[x for x in rows.splitlines()if 'hang-codex-od-test' in x or 'crash-acp-od-test'\
        \ in x]\n  f.write(json.dumps({'time':time.time(),'rows':selected})+'\\n');f.flush();time.sleep(.2)\n\
        log.close()\n# Preserve only this synthetic fixture's backend logs, not arbitrary\
        \ HOME or account configuration.\nfor i,path in enumerate(base.glob('**/backend-*.log')):(out/f'backend-{i}.log').write_bytes(path.read_bytes())\n\
        (out/'result.json').write_text(json.dumps({'command':cmd,'returncode':p.returncode,'tracked_clean':not\
        \ subprocess.check_output(['git','status','--porcelain','--untracked-files=no'],text=True).strip()},indent=2))\n\
        subprocess.run(['git','diff','--exit-code'],check=True)\nraise SystemExit(p.returncode)\n\
        \nPY\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: opendots26-${{ matrix.lane }}-${{ github.run_id }}
        path: ${{ runner.temp }}/probe26/
        if-no-files-found: error
