name: Open Dots private bounded gap candidate proof
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - dataset: locked-package
          tzpath: ''
        - dataset: system
          tzpath: /usr/share/zoneinfo
    env:
      DATABASE_BACKEND: sqlite
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
      PYTHONTZPATH: ${{ matrix.tzpath }}
      PROOF_DATASET: ${{ matrix.dataset }}
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        repository: Anil-matcha/open-dots
        ref: c417f0987f709e703dd9e32727422f1bc99688a1
        persist-credentials: false
    - uses: astral-sh/setup-uv@v5.4.2
    - run: uv sync --frozen
      working-directory: backend
    - name: Exact clean source guard
      run: 'test "$(git rev-parse HEAD)" = c417f0987f709e703dd9e32727422f1bc99688a1

        test -z "$(git status --porcelain)"'
    - name: Workflow-only SQLite observation and runtime network boundary
      shell: python
      run: 'import pathlib,base64,os

        p=pathlib.Path(os.environ[''RUNNER_TEMP''],''proof-observer'');p.mkdir(exist_ok=True)

        (p/''observe_sqlite.py'').write_bytes(base64.b64decode(''''))

        '
    - name: Verify exact runtime timezone bytes before reusing prior full future-tail certificate
      working-directory: backend
      run: "uv run --no-sync python - <<'PROOF'\nimport os,json,pathlib,hashlib,base64,datetime,tomllib\nfrom zoneinfo import available_timezones,_common,_tzpath,TZPATH\n\
        import tzdata\ncerts=json.loads(base64.b64decode(''))\n\
        cert=certs[os.environ['PROOF_DATASET']]\nlocked=next(p['version'] for p in tomllib.loads(pathlib.Path('uv.lock').read_text())['package'] if p['name']=='tzdata')\n\
        assert tzdata.__version__==locked==cert['packaged_tzdata_version']\nactual={}\nfor name in sorted(available_timezones()):\n    filename=_tzpath.find_tzfile(name)\n\
        \    if filename:data=pathlib.Path(filename).read_bytes()\n    else:\n        with _common.load_tzdata(name) as f:data=f.read()\n    actual[name]=hashlib.sha256(data).hexdigest()\n\
        assert actual==cert['all_zone_file_hashes'],'Runtime timezone file set/bytes differ from already proven certificate'\nassert hashlib.sha256(json.dumps(actual,sort_keys=True).encode()).hexdigest()==cert['dataset_sha256']\n\
        cert['reused_from_run']=39541415255\ncert['exact_runtime_files_rechecked_at']=datetime.datetime.now(datetime.UTC).isoformat()\ncert['actual_tzpath']=list(TZPATH)\n\
        pathlib.Path(os.environ['RUNNER_TEMP'],'timezone-window-preconditions.json').write_text(json.dumps(cert,indent=2))\nprint(json.dumps({k:v for k,v in cert.items()\
        \ if k!='all_zone_file_hashes'},indent=2))\nPROOF\n"
    - name: Apply exact baseline packet
      id: apply_baseline
      shell: python
      run: 'import subprocess,pathlib,base64,hashlib

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''c417f0987f709e703dd9e32727422f1bc99688a1''

        subprocess.run([''git'',''reset'',''--hard'',''HEAD''],check=True)

        p=base64.b64decode('''')

        assert hashlib.sha256(p).hexdigest()==''95221c7fd3580a80d162fcd9943faf1543b201eb3c351f5608317e08df3c9088''

        subprocess.run([''git'',''apply'',''-''],input=p,check=True)

        pathlib.Path(''/tmp/dst-expected.patch'').write_bytes(p)

        '
    - name: baseline source guard before
      shell: python
      env:
        POINT: before
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/dst-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''95221c7fd3580a80d162fcd9943faf1543b201eb3c351f5608317e08df3c9088''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''source-''+''baseline''+''-''+os.environ[''POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
    - name: baseline actual calendar regressions and controls
      id: baseline_calendar
      continue-on-error: true
      working-directory: backend
      run: PYTHONPATH="$RUNNER_TEMP/proof-observer:$PWD" PROOF_ARTIFACT_DIR="$RUNNER_TEMP" env -u RUNNER_TEMP uv run --no-sync pytest -p observe_sqlite -q tests/services/test_routine_schedule.py
        --junitxml="$RUNNER_TEMP/baseline-calendar.xml"
    - name: Exact baseline complete case identity and result oracle
      shell: python
      run: 'import pathlib,os,xml.etree.ElementTree as E,json

        p=pathlib.Path(os.environ[''RUNNER_TEMP'']);r={}

        root=E.parse(p/''baseline-calendar.xml'').getroot();cs=list(root.iter(''testcase''));assert not list(root.iter(''skipped'')) and not list(root.iter(''error''));r[''calendar'']={c.attrib[''name'']:c.find(''failure'')
        is not None for c in cs}

        assert {''test_next_after_retains_carried_gap_occurrences[''+i+'']'' for i in [''lord-howe-transition'', ''lord-howe-before-carried'', ''lord-howe-strict'',
        ''apia-skipped-friday'', ''apia-strict'', ''nonselected-monday'', ''selected-sunday'', ''multi-hour-cron'', ''dense-cron'']} <= set(r[''calendar''])

        assert {n for n,f in r[''calendar''].items() if f}=={''test_next_after_retains_carried_gap_occurrences[''+i+'']'' for i in [''lord-howe-transition'', ''lord-howe-before-carried'',
        ''apia-skipped-friday'', ''selected-sunday'', ''multi-hour-cron'']}

        print(json.dumps(r,indent=2))

        '
    - name: baseline bounded dense cost observation
      working-directory: backend
      env:
        CANDIDATE_PHASE: baseline
      run: "uv run --no-sync python - <<'MEASURE'\n\"\"\"Observed CPU time and exact real-trigger calls, separate from functional gates.\"\"\"\nimport datetime\n\
        import json\nimport os\nimport pathlib\nimport statistics\nimport time\nfrom app.services import routine_schedule as s\n\noriginal = s._crontab_trigger\n\
        counter = [0]\nclass CountedTrigger:\n    def __init__(self, trigger):\n        self.trigger = trigger\n    def get_next_fire_time(self, *args):\n       \
        \ counter[0] += 1\n        return self.trigger.get_next_fire_time(*args)\ndef counted(*args):\n    return CountedTrigger(original(*args))\ns._crontab_trigger\
        \ = counted\nrows = []\nfor label, zone, expression, after in [\n    (\"ordinary-dense\", \"UTC\", \"* * * * *\", \"2026-10-20T12:00:20+00:00\"),\n    (\"\
        berlin-dense-gap\", \"Europe/Berlin\", \"* * * * *\", \"2026-03-29T01:05:00+00:00\"),\n    (\"lord-howe-half-hour\", \"Australia/Lord_Howe\", \"15 2 * * *\"\
        , \"2026-10-03T15:30:00+00:00\"),\n    (\"apia-expired-dense-window\", \"Pacific/Apia\", \"* * * * *\", \"2011-12-31T22:00:00+00:00\"),\n]:\n    times, calls,\
        \ results = [], [], []\n    for _ in range(10):\n        counter[0] = 0\n        start = time.perf_counter()\n        result = s.next_after(\"cron\", {\"\
        expression\": expression}, zone, datetime.datetime.fromisoformat(after))\n        times.append((time.perf_counter() - start) * 1000)\n        calls.append(counter[0])\n\
        \        results.append(result.isoformat() if result else None)\n    assert len(set(results)) == 1\n    assert max(calls) <= 48 * 60 + 3, (label, calls)\n\
        \    rows.append({\"case\": label, \"median_ms\": statistics.median(times), \"max_ms\": max(times), \"real_trigger_calls\": calls, \"next\": results[0]})\n\
        pathlib.Path(os.environ[\"RUNNER_TEMP\"], \"cost-\" + os.environ[\"CANDIDATE_PHASE\"] + \".json\").write_text(json.dumps(rows, indent=2))\nprint(json.dumps(rows,\
        \ indent=2))\nMEASURE\n"
    - name: baseline source guard after
      if: ${{ always() && steps.apply_baseline.outcome == 'success' }}
      shell: python
      env:
        POINT: after
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/dst-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''95221c7fd3580a80d162fcd9943faf1543b201eb3c351f5608317e08df3c9088''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''source-''+''baseline''+''-''+os.environ[''POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
    - name: Preserve actual SQLite semantic receipts baseline
      shell: python
      run: 'import pathlib,os

        p=pathlib.Path(os.environ[''RUNNER_TEMP'']);[(f.rename(p/(''baseline-''+f.name))) for f in p.glob(''routine-gap-*.json'')]'
    - name: Apply exact candidate packet
      id: apply_candidate
      shell: python
      run: 'import subprocess,pathlib,base64,hashlib

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''c417f0987f709e703dd9e32727422f1bc99688a1''

        subprocess.run([''git'',''reset'',''--hard'',''HEAD''],check=True)

        p=base64.b64decode('''')

        assert hashlib.sha256(p).hexdigest()==''708298814b62fe2ac9511aa125e5a37722af4e9d95798e7f7ba237901cef05fa''

        subprocess.run([''git'',''apply'',''-''],input=p,check=True)

        pathlib.Path(''/tmp/dst-expected.patch'').write_bytes(p)

        '
    - name: candidate source guard before
      shell: python
      env:
        POINT: before
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/dst-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''708298814b62fe2ac9511aa125e5a37722af4e9d95798e7f7ba237901cef05fa''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''source-''+''candidate''+''-''+os.environ[''POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
    - name: candidate actual calendar regressions and controls
      id: candidate_calendar
      continue-on-error: false
      working-directory: backend
      run: PYTHONPATH="$RUNNER_TEMP/proof-observer:$PWD" PROOF_ARTIFACT_DIR="$RUNNER_TEMP" env -u RUNNER_TEMP uv run --no-sync pytest -p observe_sqlite -q tests/services/test_routine_schedule.py
        --junitxml="$RUNNER_TEMP/candidate-calendar.xml"
    - name: candidate actual sqlite regressions and controls
      id: candidate_sqlite
      continue-on-error: false
      working-directory: backend
      run: PYTHONPATH="$RUNNER_TEMP/proof-observer:$PWD" PROOF_ARTIFACT_DIR="$RUNNER_TEMP" env -u RUNNER_TEMP uv run --no-sync pytest -p observe_sqlite -q tests/services/test_routine_service.py
        -k test_review_gap_creation_keeps_documented_shifted_occurrence --junitxml="$RUNNER_TEMP/candidate-sqlite.xml"
    - name: Exact candidate complete case identity and result oracle
      shell: python
      run: 'import pathlib,os,xml.etree.ElementTree as E,json

        p=pathlib.Path(os.environ[''RUNNER_TEMP'']);r={}

        root=E.parse(p/''candidate-calendar.xml'').getroot();cs=list(root.iter(''testcase''));assert not list(root.iter(''skipped'')) and not list(root.iter(''error''));r[''calendar'']={c.attrib[''name'']:c.find(''failure'')
        is not None for c in cs}

        root=E.parse(p/''candidate-sqlite.xml'').getroot();cs=list(root.iter(''testcase''));assert not list(root.iter(''skipped'')) and not list(root.iter(''error''));r[''sqlite'']={c.attrib[''name'']:c.find(''failure'')
        is not None for c in cs}

        assert {''test_next_after_retains_carried_gap_occurrences[''+i+'']'' for i in [''lord-howe-transition'', ''lord-howe-before-carried'', ''lord-howe-strict'',
        ''apia-skipped-friday'', ''apia-strict'', ''nonselected-monday'', ''selected-sunday'', ''multi-hour-cron'', ''dense-cron'']} <= set(r[''calendar''])

        assert set(r[''sqlite''])=={''test_review_gap_creation_keeps_documented_shifted_occurrence[''+i+'']'' for i in [''before-transition'',''transition-complete'',''before-carried-time'',''strict-after-carried-time'',''ordinary-day'']}

        assert not any(r[''calendar''].values()) and not any(r[''sqlite''].values())

        print(json.dumps(r,indent=2))

        '
    - name: candidate bounded dense cost observation
      working-directory: backend
      env:
        CANDIDATE_PHASE: candidate
      run: "uv run --no-sync python - <<'MEASURE'\n\"\"\"Observed CPU time and exact real-trigger calls, separate from functional gates.\"\"\"\nimport datetime\n\
        import json\nimport os\nimport pathlib\nimport statistics\nimport time\nfrom app.services import routine_schedule as s\n\noriginal = s._crontab_trigger\n\
        counter = [0]\nclass CountedTrigger:\n    def __init__(self, trigger):\n        self.trigger = trigger\n    def get_next_fire_time(self, *args):\n       \
        \ counter[0] += 1\n        return self.trigger.get_next_fire_time(*args)\ndef counted(*args):\n    return CountedTrigger(original(*args))\ns._crontab_trigger\
        \ = counted\nrows = []\nfor label, zone, expression, after in [\n    (\"ordinary-dense\", \"UTC\", \"* * * * *\", \"2026-10-20T12:00:20+00:00\"),\n    (\"\
        berlin-dense-gap\", \"Europe/Berlin\", \"* * * * *\", \"2026-03-29T01:05:00+00:00\"),\n    (\"lord-howe-half-hour\", \"Australia/Lord_Howe\", \"15 2 * * *\"\
        , \"2026-10-03T15:30:00+00:00\"),\n    (\"apia-expired-dense-window\", \"Pacific/Apia\", \"* * * * *\", \"2011-12-31T22:00:00+00:00\"),\n]:\n    times, calls,\
        \ results = [], [], []\n    for _ in range(10):\n        counter[0] = 0\n        start = time.perf_counter()\n        result = s.next_after(\"cron\", {\"\
        expression\": expression}, zone, datetime.datetime.fromisoformat(after))\n        times.append((time.perf_counter() - start) * 1000)\n        calls.append(counter[0])\n\
        \        results.append(result.isoformat() if result else None)\n    assert len(set(results)) == 1\n    assert max(calls) <= 48 * 60 + 3, (label, calls)\n\
        \    rows.append({\"case\": label, \"median_ms\": statistics.median(times), \"max_ms\": max(times), \"real_trigger_calls\": calls, \"next\": results[0]})\n\
        pathlib.Path(os.environ[\"RUNNER_TEMP\"], \"cost-\" + os.environ[\"CANDIDATE_PHASE\"] + \".json\").write_text(json.dumps(rows, indent=2))\nprint(json.dumps(rows,\
        \ indent=2))\nMEASURE\n"
    - name: candidate source guard after
      if: ${{ always() && steps.apply_candidate.outcome == 'success' }}
      shell: python
      env:
        POINT: after
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/dst-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''708298814b62fe2ac9511aa125e5a37722af4e9d95798e7f7ba237901cef05fa''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''source-''+''candidate''+''-''+os.environ[''POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
    - name: Preserve actual SQLite semantic receipts candidate
      shell: python
      run: 'import pathlib,os

        p=pathlib.Path(os.environ[''RUNNER_TEMP'']);[(f.rename(p/(''candidate-''+f.name))) for f in p.glob(''routine-gap-*.json'')]'
    - name: Always preserve actual base and application state
      if: always()
      shell: python
      run: 'import subprocess,pathlib,json,hashlib,os

        head=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()

        assert head==''c417f0987f709e703dd9e32727422f1bc99688a1''

        diff=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        pathlib.Path(os.environ[''RUNNER_TEMP''],''actual-final-state.json'').write_text(json.dumps({''head'':head,''actual_diff_sha256'':hashlib.sha256(diff).hexdigest(),''changed_paths'':subprocess.check_output([''git'',''diff'',''--name-only''],text=True).splitlines()},indent=2))

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: open-dots-gap-candidate-${{ matrix.dataset }}-${{ github.run_id }}
        path: '${{ runner.temp }}/*.xml

          ${{ runner.temp }}/source-*.json

          ${{ runner.temp }}/actual-final-state.json

          ${{ runner.temp }}/cost-*.json

          ${{ runner.temp }}/timezone-window-preconditions.json

          ${{ runner.temp }}/*-routine-gap-*.json'
        if-no-files-found: error
