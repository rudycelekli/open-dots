        is not None for c in cs}

        root=E.parse(p/''candidate-sqlite.xml'').getroot();cs=list(root.iter(''testcase''));assert not list(root.iter(''skipped'')) and not list(root.iter(''error''));r[''sqlite'']={c.attrib[''name'']:c.find(''failure'')
        is not None for c in cs}

        assert {''test_next_after_retains_carried_gap_occurrences[''+i+'']'' for i in [''lord-howe-transition'', ''lord-howe-before-carried'', ''lord-howe-strict'',
        ''apia-skipped-friday'', ''apia-strict'', ''nonselected-monday'', ''selected-sunday'', ''multi-hour-cron'', ''dense-cron'']} <= set(r[''calendar''])

        assert set(r[''sqlite''])=={''test_review_gap_creation_keeps_documented_shifted_occurrence[''+i+'']'' for i in [''before-transition'',''transition-complete'',''before-carried-time'',''strict-after-carried-time'',''ordinary-day'']}

        assert not any(r[''calendar''].values()) and not any(r[''sqlite''].values())

        print(json.dumps(r,indent=2))

