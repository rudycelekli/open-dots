name: Open Dots private bounded gap candidate proof
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - dataset: locked-package
          tzpath: ''
        - dataset: system
          tzpath: /usr/share/zoneinfo
    env:
      DATABASE_BACKEND: sqlite
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
      PYTHONTZPATH: ${{ matrix.tzpath }}
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        repository: Anil-matcha/open-dots
        ref: c417f0987f709e703dd9e32727422f1bc99688a1
        persist-credentials: false
    - uses: astral-sh/setup-uv@v5.4.2
    - run: uv sync --frozen
      working-directory: backend
    - name: Exact clean source guard
      run: 'test "$(git rev-parse HEAD)" = c417f0987f709e703dd9e32727422f1bc99688a1

        test -z "$(git status --porcelain)"'
    - name: Workflow-only SQLite observation and runtime network boundary
      shell: python
      run: 'import pathlib,base64,os

        p=pathlib.Path(os.environ[''RUNNER_TEMP''],''proof-observer'');p.mkdir(exist_ok=True)

        (p/''observe_sqlite.py'').write_bytes(base64.b64decode(''''))

        '
    - name: Exact runtime timezone transition and400year future-tail preconditions
      working-directory: backend
      run: "uv run --no-sync python - <<'PROOF'\n\"\"\"Qualification-only TZif/future-tail audit. No private parser enters product code.\"\"\"\nimport datetime\n\
        import hashlib\nimport json\nimport os\nimport pathlib\nfrom zoneinfo import available_timezones, _common, _tzpath, _zoneinfo, TZPATH\nimport tzdata\nimport\
        \ tomllib\nlocked = next(p[\"version\"] for p in tomllib.loads(pathlib.Path(\"uv.lock\").read_text())[\"package\"] if p[\"name\"] == \"tzdata\")\nassert tzdata.__version__\
        \ == locked\n\ndef check_assumptions(spacing, forward):\n    assert min(x[0] for x in spacing) > 48 * 3600\n    assert max(x[0] for x in forward) < 48 * 3600\n\
        \n# The evaluator must reject a cancelling close transition or an overwide jump.\nfor bad_spacing, bad_forward in [([(3600,)], [(3600,)]), ([(604800,)], [(48\
        \ * 3600,)])]:\n    try:\n        check_assumptions(bad_spacing, bad_forward)\n    except AssertionError:\n        pass\n    else:\n        raise AssertionError(\"\
        Timezone precondition evaluator accepted an invalid window\")\n\nspacing = []\nforward = []\nzone_hashes = {}\ntail_zones = 0\nfuture_events = 0\nfor name\
        \ in sorted(available_timezones()):\n    filename = _tzpath.find_tzfile(name)\n    if filename:\n        data = pathlib.Path(filename).read_bytes()\n    else:\n\
        \        with _common.load_tzdata(name) as f:\n            data = f.read()\n    zone_hashes[name] = hashlib.sha256(data).hexdigest()\n    import io\n    indices,\
        \ transitions, offsets, isdst, abbreviations, tail = _common.load_data(io.BytesIO(data))\n    events = list(zip(transitions, (offsets[i] for i in indices)))\n\
        \    last_explicit = transitions[-1] if transitions else -(2**63)\n    if tail:\n        rule = _zoneinfo._parse_tz_str(tail.decode())\n        if hasattr(rule,\
        \ \"transitions\"):\n            tail_zones += 1\n            start_year = max(2026, datetime.datetime.fromtimestamp(last_explicit, datetime.UTC).year) if\
        \ transitions else 2026\n            # Gregorian weekdays and POSIX date rules repeat over 400 years.\n            # Include two extra years across each boundary\
        \ of that complete cycle.\n            for year in range(start_year, start_year + 403):\n                start, end = rule.transitions(year)\n           \
        \     std = int(rule.std.utcoff.total_seconds())\n                dst = int(rule.dst.utcoff.total_seconds())\n                for instant, offset in ((start\
        \ - std, dst), (end - dst, std)):\n                    if instant > last_explicit:\n                        events.append((instant, offset))\n           \
        \             future_events += 1\n    by_instant = {}\n    for instant, offset in events:\n        if instant in by_instant:\n            assert by_instant[instant]\
        \ == offset, (name, instant, \"conflicting offset facts\")\n        by_instant[instant] = offset\n    changes = []\n    for instant, offset in sorted(by_instant.items()):\n\
        \        if not changes or changes[-1][1] != offset:\n            changes.append((instant, offset))\n    for (a, before), (b, after) in zip(changes, changes[1:]):\n\
        \        spacing.append((b - a, name, a, b))\n        if after > before:\n            forward.append((after - before, name, b))\nassert len(zone_hashes) >=\
        \ 500\nassert spacing and forward and tail_zones > 100\nspacing.sort()\nforward.sort(reverse=True)\ncheck_assumptions(spacing, forward)\nreceipt = {\n   \
        \ \"scope\": \"Actual runtime TZPATH plus package fallback; every available zone; explicit TZif transitions and full400-year POSIX future-rule cycle. Private\
        \ Python parser used only in qualification.\",\n    \"tzpath\": list(TZPATH), \"packaged_tzdata_version\": tzdata.__version__,\n    \"zones\": len(zone_hashes),\
        \ \"future_rule_zones\": tail_zones, \"future_transition_events\": future_events,\n    \"minimum_offset_transition_spacing_seconds\": spacing[0][0], \"shortest_examples\"\
        : spacing[:10],\n    \"maximum_forward_shift_seconds\": forward[0][0], \"largest_examples\": forward[:10],\n    \"dataset_sha256\": hashlib.sha256(json.dumps(zone_hashes,\
        \ sort_keys=True).encode()).hexdigest(),\n    \"all_zone_file_hashes\": zone_hashes, \"48h_endpoint_guard_preconditions\": \"PASS for exactly identified runtime\
        \ dataset\",\n}\npathlib.Path(os.environ[\"RUNNER_TEMP\"], \"timezone-window-preconditions.json\").write_text(json.dumps(receipt, indent=2))\nprint(json.dumps({k:\
        \ v for k, v in receipt.items() if k != \"all_zone_file_hashes\"}, indent=2))\nPROOF\n"
    - name: Apply exact baseline packet
      shell: python
      run: 'import subprocess,pathlib,base64,hashlib

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''c417f0987f709e703dd9e32727422f1bc99688a1''

        subprocess.run([''git'',''reset'',''--hard'',''HEAD''],check=True)

        p=base64.b64decode('''')

        assert hashlib.sha256(p).hexdigest()==''16a5e65e21212048a1654bf4568d5356f61b8845972edf107a575c25da464074''

        subprocess.run([''git'',''apply'',''-''],input=p,check=True)

        pathlib.Path(''/tmp/dst-expected.patch'').write_bytes(p)

        '
    - name: baseline source guard before
      shell: python
      env:
        POINT: before
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/dst-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''16a5e65e21212048a1654bf4568d5356f61b8845972edf107a575c25da464074''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''source-''+''baseline''+''-''+os.environ[''POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
    - name: baseline actual calendar regressions and controls
      id: baseline_calendar
      continue-on-error: true
      working-directory: backend
      run: PYTHONPATH="$RUNNER_TEMP/proof-observer:$PWD" PROOF_ARTIFACT_DIR="$RUNNER_TEMP" env -u RUNNER_TEMP uv run --no-sync pytest -p observe_sqlite -q tests/services/test_routine_schedule.py
        --junitxml="$RUNNER_TEMP/baseline-calendar.xml"
    - name: baseline actual sqlite regressions and controls
      id: baseline_sqlite
      continue-on-error: true
      working-directory: backend
      run: PYTHONPATH="$RUNNER_TEMP/proof-observer:$PWD" PROOF_ARTIFACT_DIR="$RUNNER_TEMP" env -u RUNNER_TEMP uv run --no-sync pytest -p observe_sqlite -q tests/services/test_routine_service.py
        -k test_review_gap_creation_keeps_documented_shifted_occurrence --junitxml="$RUNNER_TEMP/baseline-sqlite.xml"
    - name: Exact baseline complete case identity and result oracle
      shell: python
      run: 'import pathlib,os,xml.etree.ElementTree as E,json

        p=pathlib.Path(os.environ[''RUNNER_TEMP'']);r={}

        root=E.parse(p/''baseline-calendar.xml'').getroot();cs=list(root.iter(''testcase''));assert not list(root.iter(''skipped'')) and not list(root.iter(''error''));r[''calendar'']={c.attrib[''name'']:c.find(''failure'')
        is not None for c in cs}

        root=E.parse(p/''baseline-sqlite.xml'').getroot();cs=list(root.iter(''testcase''));assert not list(root.iter(''skipped'')) and not list(root.iter(''error''));r[''sqlite'']={c.attrib[''name'']:c.find(''failure'')
        is not None for c in cs}

        assert {''test_next_after_retains_carried_gap_occurrences[''+i+'']'' for i in [''lord-howe-transition'', ''lord-howe-before-carried'', ''lord-howe-strict'',
        ''apia-skipped-friday'', ''apia-strict'', ''nonselected-monday'', ''selected-sunday'', ''multi-hour-cron'', ''dense-cron'']} <= set(r[''calendar''])

        assert set(r[''sqlite''])=={''test_review_gap_creation_keeps_documented_shifted_occurrence[''+i+'']'' for i in [''before-transition'',''transition-complete'',''before-carried-time'',''strict-after-carried-time'',''ordinary-day'']}

        assert {n for n,f in r[''calendar''].items() if f}=={''test_next_after_retains_carried_gap_occurrences[''+i+'']'' for i in [''lord-howe-transition'', ''lord-howe-before-carried'',
        ''apia-skipped-friday'', ''selected-sunday'', ''multi-hour-cron'']}

        assert {n for n,f in r[''sqlite''].items() if f}=={''test_review_gap_creation_keeps_documented_shifted_occurrence[transition-complete]'',''test_review_gap_creation_keeps_documented_shifted_occurrence[before-carried-time]''}

        print(json.dumps(r,indent=2))

        '
    - name: baseline bounded dense cost observation
      working-directory: backend
      env:
        CANDIDATE_PHASE: baseline
      run: "uv run --no-sync python - <<'MEASURE'\n\"\"\"Observed CPU time and exact real-trigger calls, separate from functional gates.\"\"\"\nimport datetime\n\
        import json\nimport os\nimport pathlib\nimport statistics\nimport time\nfrom app.services import routine_schedule as s\n\noriginal = s._crontab_trigger\n\
        counter = [0]\nclass CountedTrigger:\n    def __init__(self, trigger):\n        self.trigger = trigger\n    def get_next_fire_time(self, *args):\n       \
        \ counter[0] += 1\n        return self.trigger.get_next_fire_time(*args)\ndef counted(*args):\n    return CountedTrigger(original(*args))\ns._crontab_trigger\
        \ = counted\nrows = []\nfor label, zone, expression, after in [\n    (\"ordinary-dense\", \"UTC\", \"* * * * *\", \"2026-10-20T12:00:20+00:00\"),\n    (\"\
        berlin-dense-gap\", \"Europe/Berlin\", \"* * * * *\", \"2026-03-29T01:05:00+00:00\"),\n    (\"lord-howe-half-hour\", \"Australia/Lord_Howe\", \"15 2 * * *\"\
        , \"2026-10-03T15:30:00+00:00\"),\n    (\"apia-expired-dense-window\", \"Pacific/Apia\", \"* * * * *\", \"2011-12-31T22:00:00+00:00\"),\n]:\n    times, calls,\
        \ results = [], [], []\n    for _ in range(10):\n        counter[0] = 0\n        start = time.perf_counter()\n        result = s.next_after(\"cron\", {\"\
        expression\": expression}, zone, datetime.datetime.fromisoformat(after))\n        times.append((time.perf_counter() - start) * 1000)\n        calls.append(counter[0])\n\
        \        results.append(result.isoformat() if result else None)\n    assert len(set(results)) == 1\n    assert max(calls) <= 48 * 60 + 3, (label, calls)\n\
        \    rows.append({\"case\": label, \"median_ms\": statistics.median(times), \"max_ms\": max(times), \"real_trigger_calls\": calls, \"next\": results[0]})\n\
        pathlib.Path(os.environ[\"RUNNER_TEMP\"], \"cost-\" + os.environ[\"CANDIDATE_PHASE\"] + \".json\").write_text(json.dumps(rows, indent=2))\nprint(json.dumps(rows,\
        \ indent=2))\nMEASURE\n"
