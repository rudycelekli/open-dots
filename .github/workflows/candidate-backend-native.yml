name: Open Dots frozen DST candidate required native gates
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_BACKEND: sqlite
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        repository: Anil-matcha/open-dots
        ref: c417f0987f709e703dd9e32727422f1bc99688a1
        persist-credentials: false
    - name: Apply exact candidate packet
      id: apply_candidate
      shell: python
      run: 'import subprocess,pathlib,base64,hashlib

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''c417f0987f709e703dd9e32727422f1bc99688a1''

        subprocess.run([''git'',''reset'',''--hard'',''HEAD''],check=True)

        p=base64.b64decode('''')

        assert hashlib.sha256(p).hexdigest()==''88a5f4164735b3baf367bd7512cf283cd41469760356cb6189b0f082fb5a297a''

        subprocess.run([''git'',''apply'',''-''],input=p,check=True)

        pathlib.Path(''/tmp/dst-expected.patch'').write_bytes(p)

        '
      working-directory: .
    - name: candidate source guard before
      shell: python
      env:
        POINT: before
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/dst-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''88a5f4164735b3baf367bd7512cf283cd41469760356cb6189b0f082fb5a297a''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''source-''+''candidate''+''-''+os.environ[''POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
      working-directory: .
    - uses: astral-sh/setup-uv@v5.4.2
    - run: uv sync --frozen
    - run: uv run pytest -q --junitxml="$RUNNER_TEMP/backend-sqlite-tests.xml"
    - name: Exact candidate source guard after required gate
      shell: python
      env:
        POINT: after
      run: 'import subprocess,pathlib,hashlib,json,os

        a=subprocess.check_output([''git'',''diff'',''--full-index'',''--binary'',''HEAD''])

        assert a==pathlib.Path(''/tmp/dst-expected.patch'').read_bytes()

        assert hashlib.sha256(a).hexdigest()==''88a5f4164735b3baf367bd7512cf283cd41469760356cb6189b0f082fb5a297a''

        pathlib.Path(os.environ[''RUNNER_TEMP''], ''source-''+''candidate''+''-''+os.environ[''POINT'']+''.json'').write_text(json.dumps({''head'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip(),''patch_sha256'':hashlib.sha256(a).hexdigest()}))

        '
      if: ${{ always() && steps.apply_candidate.outcome == 'success' }}
      working-directory: .
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dst-required-backend-sqlite-${{ github.run_id }}
        path: '${{ runner.temp }}/*.json

          ${{ runner.temp }}/*-tests.xml'
        if-no-files-found: error
    timeout-minutes: 20
