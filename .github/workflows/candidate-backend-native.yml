        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''c417f0987f709e703dd9e32727422f1bc99688a1''

        subprocess.run([''git'',''reset'',''--hard'',''HEAD''],check=True)

