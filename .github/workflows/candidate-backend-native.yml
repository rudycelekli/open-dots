name: OpenDots native Ubuntu26 process observer width experiment
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  width:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_BACKEND: sqlite
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        repository: Anil-matcha/open-dots
        ref: c417f0987f709e703dd9e32727422f1bc99688a1
        persist-credentials: false
    - uses: astral-sh/setup-uv@v5.4.2
    - run: uv sync --frozen
    - name: Controlled original test with recorded process width
      shell: bash
      run: "uv run python <<'PY'\nimport pathlib,os,subprocess,json,platform,hashlib\n\
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'width-proof';out.mkdir()\nassert\
        \ subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='c417f0987f709e703dd9e32727422f1bc99688a1'\n\
        release=pathlib.Path('/etc/os-release').read_text();assert 'VERSION_ID=\"\
        26.04\"' in release\n(out/'runtime.json').write_text(json.dumps({'release':release,'image':os.environ.get('ImageVersion'),'python':platform.python_version(),'uvlock':hashlib.sha256(pathlib.Path('uv.lock').read_bytes()).hexdigest()},indent=2))\n\
        plugin=\"import os,json,time,threading,subprocess,pathlib,pytest\\n@pytest.fixture(autouse=True)\\\
        ndef observe_ps_width():\\n stop=threading.Event();out=pathlib.Path(os.environ['WIDTH_PROOF_DIR']);\\\
        n def observe():\\n  with (out/'inside-pytest-ps.jsonl').open('w')as f:\\\
        n   while not stop.is_set():\\n    data={'time':time.time(),'COLUMNS':os.environ.get('COLUMNS'),'LINES':os.environ.get('LINES')}\\\
        n    for label,args in [('default',['ps','-axo','pid=,command=']),('wide',['ps','-ww','-axo','pid=,command='])]:\\\
        n     r=subprocess.run(args,capture_output=True,text=True);data[label]={'returncode':r.returncode,'stderr':r.stderr,'probe_rows':[x\
        \ for x in r.stdout.splitlines()if 'hang-codex' in x or 'test_a_hanging' in\
        \ x]}\\n    f.write(json.dumps(data)+'\\\\n');f.flush();stop.wait(.2)\\n t=threading.Thread(target=observe);t.start()\\\
        n try:yield\\n finally:stop.set();t.join(5)\\n\"\nplugin_dir=out/'plugin';plugin_dir.mkdir();(plugin_dir/'ps_width_observer.py').write_text(plugin)\n\
        results=[]\nfor lane,width in [('default',None),('wide','4096')]:\n dest=out/lane;dest.mkdir();env=os.environ.copy();env['PYTHONPATH']=str(plugin_dir)+os.pathsep+str(pathlib.Path.cwd());env['WIDTH_PROOF_DIR']=str(dest)\n\
        \ if width is not None:env['COLUMNS']=width\n with (dest/'pytest.log').open('w')as\
        \ log:r=subprocess.run(['uv','run','pytest','-q','-p','ps_width_observer','tests/e2e/test_engine_resilience.py','--basetemp='+str(dest/'pytest'),'--junitxml='+str(dest/'junit.xml')],env=env,stdout=log,stderr=subprocess.STDOUT)\n\
        \ for i,p in enumerate((dest/'pytest').glob('**/backend-*.log')):(dest/f'backend-{i}.log').write_bytes(p.read_bytes())\n\
        \ results.append({'lane':lane,'requested_COLUMNS':width,'returncode':r.returncode})\n\
        (out/'results.json').write_text(json.dumps(results,indent=2));subprocess.run(['git','diff','--exit-code'],check=True)\n\
        \nPY\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: opendots-ps-width-${{ github.run_id }}
        path: ${{ runner.temp }}/width-proof/
        if-no-files-found: error
