name: Open Dots actual SQLite gap creation baseline
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_BACKEND: sqlite
      TOKEN_ENCRYPTION_KEYS: 3n3b2YkQd0xVv8m1c1m0nq1l4Z3xk9q0n7xv7y5q8wE=
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        repository: Anil-matcha/open-dots
        ref: c417f0987f709e703dd9e32727422f1bc99688a1
        persist-credentials: false
    - uses: astral-sh/setup-uv@v5.4.2
    - run: uv sync --frozen
      working-directory: backend
    - name: Exact clean source guard
      run: 'test "$(git rev-parse HEAD)" = c417f0987f709e703dd9e32727422f1bc99688a1

        test -z "$(git status --porcelain)"'
    - name: Install only native gap creation regression on exact source
      working-directory: backend
      shell: python
      run: 'import pathlib,hashlib,base64

        p=pathlib.Path(''tests/services/test_routine_service.py'')

        assert hashlib.sha256(p.read_bytes()).hexdigest()==''bdfbbee81f41bbf6a867a77a08ae7768a82a7599d269e7832ffe2f1dd0df8168''

        p.write_bytes(p.read_bytes()+base64.b64decode(''''))

        assert hashlib.sha256(p.read_bytes()).hexdigest()==''f68a50d14bb2240f77f1015adc4827077510e2ee10e537fd7614a99d26ae8d64''

        '
    - name: Actual SQLite routine creation on either side of clock transition
      id: gap
      continue-on-error: true
      working-directory: backend
      run: uv run --no-sync pytest -q tests/services/test_routine_service.py -k test_review_gap_creation_keeps_documented_shifted_occurrence --junitxml="$RUNNER_TEMP/gap-baseline-junit.xml"
    - name: Exact original source and complete five-case baseline classification
      shell: python
      run: 'import pathlib,hashlib,xml.etree.ElementTree as E,os,json,subprocess

        p=pathlib.Path(''backend/tests/services/test_routine_service.py'')

        assert hashlib.sha256(p.read_bytes()).hexdigest()==''f68a50d14bb2240f77f1015adc4827077510e2ee10e537fd7614a99d26ae8d64''

        assert subprocess.check_output([''git'',''diff'',''--name-only''],text=True).splitlines()==[''backend/tests/services/test_routine_service.py'']

        r=E.parse(pathlib.Path(os.environ[''RUNNER_TEMP''],''gap-baseline-junit.xml'')).getroot();cases=list(r.iter(''testcase''));assert len(cases)==5 and not list(r.iter(''skipped''))
        and not list(r.iter(''error''))

        failed=[c.attrib[''name''] for c in cases if c.find(''failure'') is not None];assert sorted(failed)==sorted([''test_review_gap_creation_keeps_documented_shifted_occurrence[transition-complete]'',''test_review_gap_creation_keeps_documented_shifted_occurrence[before-carried-time]''])

        assert len(list(pathlib.Path(os.environ[''RUNNER_TEMP'']).glob(''routine-gap-*.json'')))==5

        print(''NativeSQLite persisteddate baseline:2documentedcarryviolations,3controlsPASS; no fixedcandidatequalified'')

        assert {c.attrib[''name''] for c in cases}=={''test_review_gap_creation_keeps_documented_shifted_occurrence[''+i+'']'' for i in [''before-transition'',''transition-complete'',''before-carried-time'',''strict-after-carried-time'',''ordinary-day'']}

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: open-dots-gap-baseline-${{ github.run_id }}
        path: '${{ runner.temp }}/routine-gap-*.json

          ${{ runner.temp }}/gap-baseline-junit.xml'
        if-no-files-found: error
