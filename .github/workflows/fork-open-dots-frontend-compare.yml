name: Fork Open Dots frontend baseline comparison
on:
  push:
    branches: [validation/open-dots-frontend-compare-20261016]
permissions:
  contents: read
jobs:
  frontend:
    if: github.repository == 'rudycelekli/open-dots'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: [804a7de548a156067d58f9413f8d2c8309d34c78, adbc543b481aafdd997b0a25781e475543aac096]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install exact frontend lock and required gates
        working-directory: frontend
        run: |
          npm ci
          set +e
          npm run lint
          lint_rc=$?
          npm run build
          build_rc=$?
          echo "Observed lint=$lint_rc build=$build_rc source=${{ matrix.source }}"
          test "$lint_rc" -eq 0 && test "$build_rc" -eq 0
      - name: Final source guard
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.source }}"
          git diff --exit-code
